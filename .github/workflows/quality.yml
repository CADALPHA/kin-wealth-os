name: Quality checks\n\non:\n  push:\n    branches: [main]\n  pull_request:\n    branches: [main]\n\npermissions:\n  contents: read\n\njobs:\n  verify:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 22\n          cache: npm\n      - name: Reject tracked environment files\n        run: |\n          if git ls-files | grep -E '(^|/)\.env$'; then\n            echo 'Tracked .env files are not allowed. Use .env.example instead.'\n            exit 1\n          fi\n      - name: Install dependencies\n        run: npm install --ignore-scripts\n      - run: npm run lint\n      - run: npm run build\n      - run: npm test\n